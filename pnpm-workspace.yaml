minimumReleaseAge: 0

peerDependencyRules:
  ignoreMissing:
    - '@unhead/vue'
    - 'pinia'
    - '@pinia/nuxt'
  allowedVersions:
    '@unhead/vue': '*'
    'pinia': '*'
    '@pinia/nuxt': '*'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
